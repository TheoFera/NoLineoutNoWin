<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Informations officielles de l’application No Lineout No Win.">
    <title>No Lineout No Win</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17231b;
        background: #f1f5f2;
      }

      body {
        margin: 0;
        padding: 32px 20px;
      }

      main {
        width: min(100%, 720px);
        margin: 0 auto;
        padding: 40px;
        box-sizing: border-box;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgb(15 35 22 / 10%);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 8vw, 3.25rem);
        line-height: 1;
      }

      p {
        font-size: 1.05rem;
        line-height: 1.7;
      }

      a {
        display: inline-block;
        margin-top: 12px;
        padding: 14px 20px;
        border-radius: 12px;
        color: #ffffff;
        background: #145c32;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        background: #0e4725;
        text-decoration: underline;
      }

      @media (max-width: 520px) {
        body {
          padding: 16px;
        }

        main {
          padding: 28px 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No Lineout No Win</h1>
      <p>
        Retrouvez ici les informations officielles relatives à l’application mobile
        tactique consacrée à la touche au rugby.
      </p>
      <p>Version actuelle : <strong>1.0.1</strong></p>
      <a href="confidentialite/">Consulter la politique de confidentialité</a>
    </main>
  </body>
</html>
